name: CI-CD - build, test, deploy to Azure

on:
  workflow_dispatch:
  push:
    branches: [ master ]

env:
  AZURE_WEBAPP_NAME: 'newebappdemo'
  DOTNET_VERSION: '8.0'

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: |
          if (Test-Path "tests") {
            dotnet test tests --no-build --logger "trx"
          }
          else {
            Write-Output "No tests found; skipping"
          }

      - name: Publish
        run: dotnet publish -c Release -o ./publish --no-build

      - name: Zip files for deployment
        run: Compress-Archive -Path publish\* -DestinationPath app.zip -Force

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip
