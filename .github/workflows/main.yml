name: CI-CD - build, test, deploy to Azure

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0' # choose your target

      - name: Restore
        run: dotnet restore src/MyAspNetCoreApp

      - name: Build
        run: dotnet build src/MyAspNetCoreApp --configuration Release --no-restore

      - name: Test
        run:  |
          if (Test-Path "tests") {
            dotnet test tests --no-build --logger "trx"
          }
          else {
            Write-Output "No tests found; skipping"
          }


      - name: Publish
        run: dotnet publish src/MyAspNetCoreApp -c Release -o ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'newebappdemo'      # replace with your app name
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
